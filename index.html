<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo dõi dự án — Quy hoạch (trực tiếp)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #12233f;
    --navy-2: #1f3a63;
    --paper: #f2f4f7;
    --card: #ffffff;
    --ink: #16202e;
    --muted: #6b7688;
    --line: #e3e7ee;
    --amber: #b8611a;
    --amber-bg: #fdf1e6;
    --red: #b3261e;
    --red-bg: #fdeceb;
    --green: #1b7a3d;
    --green-bg: #e9f7ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  header.top {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
    padding: 28px 20px 22px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-textblock { min-width: 0; }
  .logo-plate {
    background: #ffffff;
    border-radius: 8px;
    padding: 6px 10px;
    display: inline-flex;
    align-items: center;
    flex-shrink: 0;
  }
  .logo-img { height: 30px; width: auto; display: block; }
  header.top .eyebrow {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #9fb3d1;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #35d07f;
    display: inline-block;
    box-shadow: 0 0 0 0 rgba(53,208,127,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(53,208,127,0.55); }
    70% { box-shadow: 0 0 0 7px rgba(53,208,127,0); }
    100% { box-shadow: 0 0 0 0 rgba(53,208,127,0); }
  }
  header.top h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    margin: 0 0 4px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header.top .meta {
    font-size: 13px;
    color: #c3d2e8;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header.top .meta b { color: #fff; }
  .refresh-btn {
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
  }
  .refresh-btn:hover { background: rgba(255,255,255,0.16); }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; }

  .controls {
    max-width: 1100px;
    margin: -18px auto 0;
    padding: 0 16px;
    position: relative;
    z-index: 2;
  }
  .search-box {
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 8px 24px rgba(18,35,63,0.12);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    border: 1px solid var(--line);
  }
  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: transparent;
  }
  .search-box svg { flex-shrink: 0; color: var(--muted); }

  .filters {
    max-width: 1100px;
    margin: 14px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
    user-select: none;
  }
  .chip:hover { border-color: var(--navy-2); }
  .chip.active {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
  }

  .count-bar {
    max-width: 1100px;
    margin: 14px auto 0;
    padding: 0 20px;
    font-size: 12.5px;
    color: var(--muted);
    font-weight: 500;
  }

  .grid {
    max-width: 1100px;
    margin: 10px auto 60px;
    padding: 0 16px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media (min-width: 720px) {
    .grid { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 1080px) {
    .grid { grid-template-columns: 1fr 1fr 1fr; }
  }

  .card {
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--line);
    padding: 16px 16px 14px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--bar-color, #c7cdd6);
  }
  .card.ngoai { background: #f7f7f8; }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .card-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16.5px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.25;
  }
  .card-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
  }
  .dot { color: var(--line); }

  .badge {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .badge.status-cho { color: var(--amber); background: var(--amber-bg); }
  .badge.status-dung { color: var(--red); background: var(--red-bg); }
  .badge.status-done { color: var(--green); background: var(--green-bg); }
  .badge.status-default { color: var(--navy-2); background: #eef2f8; }

  .theloai-tag {
    font-size: 11px;
    font-weight: 600;
    color: var(--navy-2);
    background: #eef2f8;
    padding: 3px 9px;
    border-radius: 6px;
  }

  .drawing-links {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .drawing-btn {
    font-size: 11px;
    font-weight: 600;
    color: var(--navy-2);
    background: #fff;
    border: 1px solid var(--navy-2);
    padding: 4px 10px;
    border-radius: 999px;
    text-decoration: none;
    white-space: nowrap;
  }
  .drawing-btn:hover {
    background: var(--navy-2);
    color: #fff;
  }

  .update-box {
    background: #f7f8fa;
    border-radius: 9px;
    padding: 9px 11px;
    font-size: 13px;
    line-height: 1.45;
    color: #333d4d;
    white-space: pre-line;
    max-height: 110px;
    overflow-y: auto;
  }

  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: auto;
    padding-top: 6px;
  }
  .card-foot .pic {
    font-weight: 600;
    color: var(--ink);
  }
  .recency {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .empty-state, .error-state, .loading-state {
    max-width: 1100px;
    margin: 40px auto;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 0 20px;
  }
  .error-state {
    background: var(--red-bg);
    color: var(--red);
    border-radius: 12px;
    padding: 18px 20px;
    font-weight: 500;
    line-height: 1.6;
  }
  .loading-state {
    color: var(--navy-2);
  }

  details.tomtat-toggle { margin-top: 2px; }
  details.tomtat-toggle summary {
    font-size: 11.5px;
    color: var(--navy-2);
    cursor: pointer;
    font-weight: 600;
    list-style: none;
  }
  details.tomtat-toggle summary::-webkit-details-marker { display:none; }
  details.tomtat-toggle summary::before { content: "▸ "; }
  details.tomtat-toggle[open] summary::before { content: "▾ "; }
  details.tomtat-toggle .tomtat-body {
    font-size: 12.5px;
    color: #4b5566;
    white-space: pre-line;
    margin-top: 6px;
    background: #fafbfc;
    border-radius: 8px;
    padding: 8px 10px;
    border: 1px solid var(--line);
  }

  footer.page-foot {
    text-align: center;
    font-size: 11.5px;
    color: #9aa1ad;
    padding: 0 20px 30px;
  }
</style>
</head>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwij-Hxq5xGbibJ7rLbaYYGru86aDX1RcgLiJ-O0D3Eqy3wLFTJJ8iiay8Su5I2mrXKvg/exec";

let DATA = [];
let state = { search: '', cdt: 'Tất cả', diadiem: 'Tất cả', tg: 'Tất cả' };

// Dữ liệu lấy qua Apps Script Web App (trả JSON, mỗi dòng là 1 object theo tên cột trong Dashboard)
function jsonToData(rows) {
  const out = [];
  for (const p of rows) {
    const ten = (p['Tên dự án'] || '').trim();
    if (!ten) continue;
    out.push({
      nhom: p['Nhóm'] || '',
      diadiem: p['Địa điểm'] || '',
      theloai: p['Thể loại'] || '',
      tomtat: p['Tóm tắt dự án'] || '',
      ten: ten,
      noidung: p['Nội dung cập nhật mới nhất'] || '',
      trangthai: p['Trạng thái'] || '',
      ngay: p['Ngày cập nhật'] || '',
      nguoi: p['Người phụ trách'] || '',
      songay: p['Số ngày'] || '',
      loctg: p['Lọc thời gian'] || '',
      phankhuc: p['Phân khúc (CĐT)'] || '',
      banveDeXuat: p['Bản vẽ đề xuất'] || '',
      banveCTDT: p['Bản vẽ đã duyệt CTĐT'] || '',
      banveQH500: p['Bản vẽ đã duyệt QH 1/500'] || '',
      maps: p['Maps (ranh giới dự án)'] || '',
      video: p['Video hiện trạng'] || '',
    });
  }
  return out;
}

function statusClass(s) {
  if (!s) return 'status-default';
  if (s.includes('Chờ')) return 'status-cho';
  if (s.includes('Dừng')) return 'status-dung';
  if (s.includes('Hoàn thành')) return 'status-done';
  return 'status-default';
}
function recencyStyle(tg) {
  if (tg === 'Tuần này') return {color:'#1b7a3d', bg:'#e9f7ee'};
  if (tg === '1 Tuần trước') return {color:'#b8611a', bg:'#fdf1e6'};
  if (tg === '2 tuần trước') return {color:'#c17817', bg:'#fdf6e6'};
  return {color:'#7c8494', bg:'#eef0f3'};
}
function barColor(tg) {
  if (tg === 'Tuần này') return '#1b7a3d';
  if (tg === '1 Tuần trước') return '#b8611a';
  if (tg === '2 tuần trước') return '#c17817';
  return '#c7cdd6';
}

// Quy đổi Phân khúc (đang lưu theo tên CĐT gốc) sang mã Chủ đầu tư: P / R / LH / K
function phankhucToCDT(pk) {
  if (!pk) return 'K';
  const s = pk.toLowerCase();
  if (s.includes('pristie')) return 'P';
  if (s.includes('ramond')) return 'R';
  if (s.includes('light-housing') || s.includes('lighthousing')) return 'LH';
  return 'K';
}
const CDT_LABELS = { P: 'P: Pristie', R: 'R: Ramond Holding', LH: 'LH: LightHousing', K: 'K: Khác/chưa xác định' };

function uniqueVals(key) {
  const s = new Set(DATA.map(d => d[key]).filter(Boolean));
  return Array.from(s);
}

function renderFilters() {
  const cdtWrap = document.getElementById('cdtFilters');
  const diadiemWrap = document.getElementById('diadiemFilters');
  const tgWrap = document.getElementById('tgFilters');
  const cdts = ['Tất cả', 'P', 'R', 'LH', 'K'];
  const diadiems = ['Tất cả', ...uniqueVals('diadiem')];
  const tgs = ['Tất cả', 'Tuần này', '1 Tuần trước', '2 tuần trước', 'Còn lại quá 2 tuần'];

  cdtWrap.innerHTML = cdts.map(c =>
    `<div class="chip ${state.cdt===c?'active':''}" data-cdt="${c}">${c==='Tất cả'?'Tất cả CĐT':CDT_LABELS[c]}</div>`
  ).join('');
  diadiemWrap.innerHTML = diadiems.map(d =>
    `<div class="chip ${state.diadiem===d?'active':''}" data-diadiem="${d}">${d}</div>`
  ).join('');
  tgWrap.innerHTML = tgs.map(t =>
    `<div class="chip ${state.tg===t?'active':''}" data-tg="${t}">${t}</div>`
  ).join('');

  cdtWrap.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => { state.cdt = el.dataset.cdt; renderFilters(); renderGrid(); });
  });
  diadiemWrap.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => { state.diadiem = el.dataset.diadiem; renderFilters(); renderGrid(); });
  });
  tgWrap.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => { state.tg = el.dataset.tg; renderFilters(); renderGrid(); });
  });
}

function matches(d) {
  if (state.cdt !== 'Tất cả' && phankhucToCDT(d.phankhuc) !== state.cdt) return false;
  if (state.diadiem !== 'Tất cả' && d.diadiem !== state.diadiem) return false;
  if (state.tg !== 'Tất cả' && d.loctg !== state.tg) return false;
  if (state.search) {
    const s = state.search.toLowerCase();
    const hay = [d.ten, d.diadiem, d.nguoi, d.noidung, d.theloai].join(' ').toLowerCase();
    if (!hay.includes(s)) return false;
  }
  return true;
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function drawingLinksHtml(d) {
  const links = [
    { url: d.banveDeXuat, label: 'Đề xuất', icon: '📐' },
    { url: d.banveCTDT, label: 'Đã duyệt CTĐT', icon: '📐' },
    { url: d.banveQH500, label: 'Đã duyệt QH 1/500', icon: '📐' },
    { url: d.maps, label: 'Bản đồ', icon: '📍' },
    { url: d.video, label: 'Video hiện trạng', icon: '🎬' },
  ].filter(l => l.url && l.url.trim());
  if (!links.length) return '';
  return `<div class="drawing-links">${links.map(l =>
    `<a class="drawing-btn" href="${escapeHtml(l.url)}" target="_blank" rel="noopener">${l.icon} ${l.label}</a>`
  ).join('')}</div>`;
}

function cardHtml(d) {
  const rec = recencyStyle(d.loctg);
  const bar = barColor(d.loctg);
  const tomtatShort = d.tomtat || '';
  return `
  <div class="card" style="--bar-color:${bar}">
    <div class="card-top">
      <div>
        <div class="card-title">${escapeHtml(d.ten)}</div>
        <div class="card-sub">
          <span>${escapeHtml(d.diadiem||'—')}</span>
          <span class="dot">•</span>
          <span class="theloai-tag">${escapeHtml(d.theloai||'Chưa phân loại')}</span>
        </div>
      </div>
      <span class="badge ${statusClass(d.trangthai)}">${escapeHtml(d.trangthai||'—')}</span>
    </div>

    <div class="update-box">${escapeHtml(d.noidung || 'Chưa có cập nhật')}</div>

    ${tomtatShort ? `<details class="tomtat-toggle"><summary>Xem tóm tắt dự án</summary><div class="tomtat-body">${escapeHtml(tomtatShort)}</div></details>` : ''}

    ${drawingLinksHtml(d)}

    <div class="card-foot">
      <span>Cập nhật: <b>${escapeHtml(d.ngay)||'—'}</b> · PIC <span class="pic">${escapeHtml(d.nguoi||'—')}</span></span>
      <span class="recency" style="color:${rec.color};background:${rec.bg}">${escapeHtml(d.loctg)||'—'}</span>
    </div>
  </div>`;
}

function statusBadgeSimple(s) {
  const cls = statusClass(s);
  const rec = { 'status-cho': ['#b8611a','#fdf1e6'], 'status-dung': ['#b3261e','#fdeceb'], 'status-done': ['#1b7a3d','#e9f7ee'], 'status-default': ['#1f3a63','#eef2f8'] }[cls];
  return `<span class="badge ${cls}" style="color:${rec[0]};background:${rec[1]}">${escapeHtml(s||'—')}</span>`;
}

function rowHtml(d) {
  return `<tr style="border-bottom:1px solid var(--line);">
    <td style="padding:10px 12px;font-size:13px;"><div style="font-weight:700;">${escapeHtml(d.ten)}</div><div style="font-size:11px;color:var(--muted);">${escapeHtml(d.diadiem||'')} · ${escapeHtml(d.theloai||'')}</div></td>
    <td style="padding:10px 12px;">${statusBadgeSimple(d.trangthai)}</td>
    <td style="padding:10px 12px;font-size:13px;color:#333d4d;max-width:320px;">${escapeHtml(d.noidung||'Chưa có cập nhật')}</td>
    <td style="padding:10px 12px;font-size:13px;">${escapeHtml(d.nguoi||'—')}</td>
    <td style="padding:10px 12px;font-size:12px;"><div>${escapeHtml(d.ngay)||'—'}</div><div style="color:var(--muted);">${escapeHtml(d.loctg)||''}</div></td>
  </tr>`;
}

let currentView = 'card';

function renderGrid() {
  const grid = document.getElementById('grid');
  const tbody = document.getElementById('tbody');
  const filtered = DATA.filter(matches);
  document.getElementById('countBar').textContent = `${filtered.length} / ${DATA.length} dự án`;
  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
  grid.innerHTML = filtered.map(cardHtml).join('');
  tbody.innerHTML = filtered.map(rowHtml).join('');
}

document.getElementById('viewCardBtn').addEventListener('click', function() {
  currentView = 'card';
  this.classList.add('active');
  document.getElementById('viewTableBtn').classList.remove('active');
  document.getElementById('grid').style.display = '';
  document.getElementById('tableWrap').style.display = 'none';
});
document.getElementById('viewTableBtn').addEventListener('click', function() {
  currentView = 'table';
  this.classList.add('active');
  document.getElementById('viewCardBtn').classList.remove('active');
  document.getElementById('grid').style.display = 'none';
  document.getElementById('tableWrap').style.display = '';
});

async function loadData(isManual) {
  const btn = document.getElementById('refreshBtn');
  const loadingEl = document.getElementById('loadingState');
  const errorEl = document.getElementById('errorState');
  if (isManual) { btn.disabled = true; btn.textContent = '↻ Đang tải...'; }
  try {
    const res = await fetch(WEB_APP_URL + '?action=listProjects', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    DATA = jsonToData(json);
    loadingEl.style.display = 'none';
    errorEl.style.display = 'none';
    document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString('vi-VN') + ' ' + new Date().toLocaleDateString('vi-VN');
    renderFilters();
    renderGrid();
  } catch (err) {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Không tải được dữ liệu (' + err.message + '). Thử bấm Làm mới, hoặc kiểm tra lại kết nối mạng.';
  } finally {
    if (isManual) { btn.disabled = false; btn.textContent = '↻ Làm mới ngay'; }
  }
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value.trim();
  renderGrid();
});
document.getElementById('refreshBtn').addEventListener('click', () => loadData(true));

loadData(false);
setInterval(() => loadData(false), 300000);
</script>
</body>
